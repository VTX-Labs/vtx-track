version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      types:
        patterns:
          - "@types/*"
    # The native addons ship prebuilt binaries; pin major bumps for manual review.
    ignore:
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@paymoapp/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks tsup's dts build (rollup-plugin-dts is incompatible);
      # hold on TS 6/7 until the toolchain supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
