version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    groups:
      # One PR for every non-major npm update. Majors are excluded so they
      # arrive as separate, reviewable PRs instead of poisoning the batch.
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    # The native addons ship prebuilt binaries; pin major bumps for manual review.
    ignore:
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@paymoapp/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks tsup's dts build (rollup-plugin-dts is incompatible);
      # hold on TS 6/7 until the toolchain supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
