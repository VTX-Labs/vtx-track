name: Release installers

# Builds the packaged installers (MSI / pkg / deb) on their native OSes and
# attaches them to the GitHub Release. Each installer must be built on a host of
# its own platform because it bundles that platform's prebuilt native addons.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to upload release assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        run: node scripts/package/windows/build-msi.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: vtx-track-msi
          path: dist-installers/*.msi

  macos-pkg:
    name: macOS pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pkg
        run: node scripts/package/macos/build-pkg.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: vtx-track-pkg
          path: dist-installers/*.pkg

  linux-deb:
    name: Linux deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build deb
        run: node scripts/package/linux/build-deb.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: vtx-track-deb
          path: dist-installers/*.deb

  publish:
    name: Attach to release
    needs: [windows-msi, macos-pkg, linux-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish installers to the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
