<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vtx-track</title>
    <style>
      :root {
        --vtx-blue: #3182ce;
        --bg: #ffffff;
        --fg: #1a202c;
        --muted: #718096;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a202c;
          --fg: #f7fafc;
          --muted: #a0aec0;
          --border: #2d3748;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      header .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      header .dot.on { background: var(--vtx-blue); }
      header strong { font-size: 14px; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .label { color: var(--muted); }
      .domain {
        font-weight: 600;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        word-break: break-all;
      }
      hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--vtx-blue);
        color: #fff;
        border-radius: 6px;
        padding: 7px 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button.paused { background: transparent; color: var(--fg); }
      .footer {
        margin-top: 12px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }
      .footer a { color: var(--vtx-blue); text-decoration: none; }
      .options {
        margin-top: 8px;
        background: transparent;
        color: var(--vtx-blue);
        border-color: var(--border);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <strong>vtx-track</strong>
    </header>

    <div class="row">
      <span class="label">Tracking</span>
      <span class="domain" id="domain">—</span>
    </div>

    <hr />

    <button id="toggle">Pause tracking</button>
    <button id="open-options" class="options" type="button">Settings</button>

    <div class="footer">
      Domain only · localhost · no telemetry<br />
      <a href="https://vtxlabs.dev" target="_blank" rel="noreferrer">VTX Labs</a>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
